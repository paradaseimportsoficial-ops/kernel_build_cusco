name: Build KernelSU Next com SUSFS LKM para Moto Edge 50 Fusion (CUSCO)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente e repositório Android Kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y repo ccache bison libssl-dev libelf-dev python3-pip lz4 pigz git curl
          pip3 install gdown
          mkdir -p android-kernel
          cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Integrar KernelSU Next e SUSFS no código-fonte
        run: |
          cd android-kernel/common
          
          # 1. Clonar repositório SUSFS e aplicar patch
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs-patch
          PATCH_FILE=$(find susfs-patch/ -name "*5.10*.patch" | head -n 1)
          patch -p1 < "$PATCH_FILE"
          cp -r susfs-patch/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp -r susfs-patch/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          
          # 2. Adicionar as flags obrigatórias do SUSFS e KernelSU no defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> arch/arm64/configs/gki_defconfig

          # 3. Injeção Direta do KernelSU-Next na árvore de drivers do kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          
          # Vincula permanentemente a pasta ao Makefile de drivers para evitar exclusão
          if [ -d "KernelSU" ] && [ ! -d "drivers/kernelsu" ]; then
            mv KernelSU drivers/kernelsu
            echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          fi

      - name: Configurar Swap de 12GB para evitar falta de memória
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Compilar Kernel do Zero com suporte integrado (GKI 5.10)
        run: |
          cd android-kernel
          
          # Limpeza segura preservando estritamente a árvore do KernelSU
          rm -rf out
          cd common
          git checkout .
          git clean -fdx -e drivers/kernelsu
          cd ..
          
          # Remove o sufixo -dirty do Git para validação do Makefile
          touch common/.scmversion
          
          BUILD_CONFIG=common/build.config.gki.aarch64 LOCALVERSION=-tecnico-root-susfs ./build/build.sh

      - name: Processar e Reempacotar com Magiskboot
        run: |
          mkdir -p work
          cd work

          # 1. Baixar o boot.img original do Google Drive
          gdown "https://drive.google.com/uc?id=1EgRqgNADhh43VMkw7ImyqqJl37UJ4yUN" -O boot_stock.img

          # 2. Extrair magiskboot do APK do Magisk
          curl -L -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v26.1/Magisk-v26.1.apk
          unzip -q magisk.apk
          cp lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot

          # 3. Descompactar o boot.img estoque
          ./magiskboot unpack boot_stock.img

          # 4. Localizar a imagem criada pela compilação
          COMPILED_IMAGE=$(find ../android-kernel/out -name "Image" -type f | head -n 1)
          echo "Kernel compilado encontrado em: $COMPILED_IMAGE"

          # 5. Identificar o formato do kernel original e comprimir adequadamente
          KERNEL_FMT=$(file kernel | grep -o -E 'LZ4|gzip|raw' || echo "raw")
          echo "Formato detectado do kernel original: $KERNEL_FMT"

          if [[ "$KERNEL_FMT" == *"LZ4"* ]]; then
             lz4 -c -12 "$COMPILED_IMAGE" > kernel
          elif [[ "$KERNEL_FMT" == *"gzip"* ]]; then
             gzip -c -9 "$COMPILED_IMAGE" > kernel
          else
             cp "$COMPILED_IMAGE" kernel
          fi

          # 6. Reempacotar o boot.img final
          ./magiskboot repack boot_stock.img boot_finished.img
          cp boot_finished.img ../boot_finished.img

      - name: Anexar Artefato (boot.img Final com SUSFS)
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_Next_SUSFS_Moto_Edge_50_Fusion
          path: boot_finished.img
          
