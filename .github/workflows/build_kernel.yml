name: Build KernelSU Next para Moto Edge 50 Fusion (CUSCO)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente e repositório Android Kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y repo ccache bison libssl-dev libelf-dev python3-pip
          pip3 install gdown
          mkdir -p android-kernel
          cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Integrar KernelSU Next
        run: |
          cd android-kernel/common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Configurar Swap de 12GB para evitar falta de memória
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Compilar Kernel
        run: |
          cd android-kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 ./build/build.sh

      - name: Baixar boot.img do Google Drive e Montar Arquivo Final
        run: |
          mkdir -p work
          cd work

          # 1. Baixar o boot.img usando a sintaxe atualizada do gdown
          gdown "https://drive.google.com/uc?id=1KsBArIpnxcq4haIoXOT1Hk_qCJntBBE-" -O boot.img

          # 2. Extrair magiskboot do APK do Magisk
          curl -L -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v26.1/Magisk-v26.1.apk
          unzip -q magisk.apk
          cp lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot

          # 3. Descompactar boot.img, substituir o kernel e reempacotar
          ./magiskboot unpack boot.img
          cp ../android-kernel/out/**/Image.lz4 kernel
          ./magiskboot repack boot.img ../boot.img

      - name: Anexar Artefato (boot.img Final)
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_Next_Moto_Edge_50_Fusion
          path: work/boot.img
          
