name: Build KernelSU Next para Moto Edge 50 Fusion (CUSCO)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente e repositório Android Kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y repo ccache bison flex libssl-dev libelf-dev
          mkdir -p android-kernel
          cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Integrar KernelSU Next
        run: |
          cd android-kernel/common
          curl -LSs "https://raw.githubusercontent.com/rifs2001/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Compilar Kernel
        run: |
          cd android-kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 ./build/build.sh

      - name: Baixar Magiskboot e Montar boot.img Final
        run: |
          mkdir -p work
          cd work

          curl -L -o magiskboot.tar.xz https://github.com/aosp-realm/magiskboot/releases/download/v26.1/magiskboot-x86_64.tar.xz
          tar -xf magiskboot.tar.xz
          chmod +x magiskboot

          curl -L -o boot_stock.img "https://github.com/paradasimportsoficial-ops/kernel_build_cusco/releases/download/stock/boot.img"

          ./magiskboot unpack boot_stock.img
          cp ../android-kernel/out/**/Image.lz4 kernel
          ./magiskboot repack boot_stock.img ../boot.img

      - name: Anexar Artefato (boot.img Final)
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_Next_Moto_Edge_50_Fusion
          path: boot.img
          
